name: Test FTP Upload

on:
  workflow_dispatch:

jobs:
  ftp-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create test file
        run: |
          mkdir -p test_upload
          echo "Hello from GitHub Actions!" > test_upload/test.txt
          date >> test_upload/test.txt

      - name: Port test
        run: |
          nc -vz server77s.irwebspace.com 21
