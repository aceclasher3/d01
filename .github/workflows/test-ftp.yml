name: Test FTP Upload

on:
  workflow_dispatch:

jobs:
  ftp-test:
    runs-on: ubuntu-latest

    steps:
      - name: Create test file
        run: |
          echo "Hello from GitHub Actions!" > test.txt
          date >> test.txt

      - name: Upload to FTP
        run: |
          curl -T test.txt \
          --ftp-create-dirs \
          -u "gitftp@acewp.ir:J47iShIj0EpyuJ95" \
          "ftp://server77s.irwebspace.com/public_html/github-test/test.txt"
