name: PHP Upload Test

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Create test file
        run: |
          echo "Hello from GitHub Actions 🚀" > test.txt
          date >> test.txt

      - name: Upload to PHP server
        run: |
          curl -X POST \
            -F "file=@test.txt" \
            "https://acewp.ir/dev/uploader.php"
